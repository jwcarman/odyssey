name: CI with Maven

on:
  # Keeps the SonarCloud token alive. A token is "never expires, if used", so a project that goes
  # quiet for a month loses it and every build after that fails on a credential nobody revoked.
  # Twice a month leaves plenty of margin against that.
  schedule:
    - cron: '0 9 1,15 * *'
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    - name: Build with Maven
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Analysed only when there is a token to analyse with. Dependabot-triggered workflows
      # cannot see repository secrets, and a token can quietly expire between pushes; neither
      # is a reason to fail a build whose tests have already passed.
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          mvn -Pci -B verify sonar:sonar
        else
          mvn -Pci -B verify
        fi
